services:
  lehrermaps-backend:
    profiles: [standalone]
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /app/server
    command: npm start
    env_file:
      - server/env.txt
    environment:
      PORT: 3001
      BIND_HOST: 0.0.0.0
      SQLITE_PATH: /app/server/data/lehrermaps.sqlite
      PROJECT_DIR: /app
      TERMINAL_SHELL: /usr/bin/fish
      ALLOWED_ORIGIN: http://localhost,http://127.0.0.1,http://localhost:8090,http://127.0.0.1:8090,http://localhost:3001,http://127.0.0.1:3001
    expose:
      - "3001"
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./:/app
      - lehrermaps-backend-node-modules:/app/server/node_modules
      - lehrermaps-sqlite-data:/app/server/data
    networks:
      - lehrermaps
    restart: unless-stopped

volumes:
  lehrermaps-backend-node-modules:
  lehrermaps-sqlite-data:

networks:
  lehrermaps:
