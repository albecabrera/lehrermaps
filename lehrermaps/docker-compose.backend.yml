services:
  lehrermaps-backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    working_dir: /app/server
    command: npm start
    env_file:
      - server/env.txt
    environment:
      PORT: 3001
      DB_HOST: xampp-mariadb
      DB_PORT: 3306
      DB_USER: root
      DB_PASS: ""
      DB_NAME: lehrermaps
      PROJECT_DIR: /app
      ALLOWED_ORIGIN: http://localhost,http://127.0.0.1,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3001,http://127.0.0.1:3001
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - ./:/app
      - lehrermaps-backend-node-modules:/app/server/node_modules
    networks:
      - lehrermaps-xampp
    restart: unless-stopped

volumes:
  lehrermaps-backend-node-modules:

networks:
  lehrermaps-xampp:
    external: true
    name: xampp_xampp-net
