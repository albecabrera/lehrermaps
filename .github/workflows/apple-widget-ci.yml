name: Apple widget CI

on:
  push:
    paths:
      - "apple/**"
      - ".github/workflows/apple-widget-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apple/**"
      - ".github/workflows/apple-widget-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select an available iPhone simulator
        id: simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(device["udid"] for runtime in devices.values() for device in runtime if device["isAvailable"] and device["name"].startswith("iPhone")))')
          echo "id=$DEVICE_ID" >> "$GITHUB_OUTPUT"

      - name: Build and test iOS Simulator
        working-directory: apple
        run: |
          xcodebuild -project LehrerMaps.xcodeproj -scheme LehrerMaps \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO test

      - name: Build and test macOS
        working-directory: apple
        run: |
          xcodebuild -project LehrerMaps.xcodeproj -scheme LehrerMaps \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO test
