# LehrerMaps — XAMPP Apache reverse proxy
#
# 1) En /Applications/XAMPP/xamppfiles/etc/httpd.conf
#    asegurate de tener activa esta línea:
#    Include etc/extra/httpd-vhosts.conf
#
# 2) En /Applications/XAMPP/xamppfiles/etc/extra/httpd-vhosts.conf
#    pegá este bloque al final:
#
# Listen 8090
#
# <VirtualHost *:8090>
#     ServerName localhost
#     ProxyPreserveHost On
#     ProxyRequests Off
#     ProxyPass / http://lehrermaps-backend:3001/
#     ProxyPassReverse / http://lehrermaps-backend:3001/
#     ErrorLog "logs/lehrermaps-error_log"
#     CustomLog "logs/lehrermaps-access_log" common
# </VirtualHost>
#
# 3) Reiniciá Apache desde XAMPP.
#
# Resultado:
#   http://localhost:8090
